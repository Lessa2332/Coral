<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Підводний світ AR (8th Wall + SLAM)</title>
  <style>
    body { margin: 0; overflow: hidden; font-family: system-ui, sans-serif; }
    #info {
      position: absolute;
      top: 20px;
      left: 0;
      right: 0;
      text-align: center;
      color: white;
      background: rgba(0,0,0,0.6);
      padding: 10px;
      z-index: 10;
      pointer-events: none;
      backdrop-filter: blur(8px);
    }
    #btn {
      position: absolute;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      padding: 14px 30px;
      font-size: 20px;
      background: #00bfff;
      color: white;
      border: none;
      border-radius: 50px;
      cursor: pointer;
      z-index: 20;
      font-weight: bold;
      box-shadow: 0 4px 15px rgba(0,0,0,0.3);
    }
    #btn:active { background: #0099cc; }
    @media (max-width: 600px) {
      #btn { padding: 12px 24px; font-size: 18px; }
      #info { font-size: 14px; top: 10px; }
    }
    .controls-note {
      position: absolute;
      bottom: 20px;
      left: 20px;
      color: white;
      background: rgba(0,0,0,0.5);
      padding: 5px 10px;
      border-radius: 20px;
      font-size: 12px;
      pointer-events: none;
      z-index: 20;
    }
  </style>
</head>
<body>
  <div id="info">🐠 Підготовка AR-сцени...</div>
  <button id="btn">🐬 УВІЙТИ В ПІДВОДНИЙ СВІТ</button>
  <div id="controls-note" class="controls-note" style="display: none;">🖱️ Обертай сцену пальцем/мишею</div>

  <audio id="sound" loop src="assets/sounds/okean.mp3"></audio>

  <!-- Точка входу для 8th Wall: підключаємо A-Frame та бінарний файл -->
  <script src="https://cdn.8thwall.com/web/aframe/8frame-1.3.0.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@8thwall/engine-binary@1/dist/xr.js" async crossorigin="anonymous" data-preload-chunks="slam"></script>

  <!-- Тригер для запуску нашої логіки після готовності 8th Wall -->
  <script>
    window.addEventListener('load', () => {
      const btn = document.getElementById('btn');
      btn.addEventListener('click', () => {
        // Показуємо, що AR запускається
        document.getElementById('info').innerHTML = '🎥 Запуск AR. Наведіть камеру на підлогу...';
        btn.style.display = 'none';
        
        // Ініціалізуємо нашу Three.js логіку, передаючи XR8
        initUnderwaterAR();
      });
    });

    async function initUnderwaterAR() {
      // Чекаємо на готовність глобального об'єкта XR8 від 8th Wall
      while (typeof XR8 === 'undefined') {
        await new Promise(resolve => setTimeout(resolve, 100));
      }

      // Використовуємо pipeline module для 8th Wall + Three.js
      XR8.addPipelineModules([
        XR8.Threejs.pipelineModule(), // Модуль для роботи з Three.js
        XR8.XrController.pipelineModule(), // Модуль для SLAM трекінгу
        customPipelineModule() // Наш власний модуль для 3D-логіки
      ]);

      // Запускаємо 8th Wall
      XR8.run({ canvas: document.createElement('canvas') });
    }

    function customPipelineModule() {
      let scene, camera, renderer, worldGroup, models = [], placed = false, sound;
      let hitTestSource = null;
      let referenceSpace = null;

      return {
        name: 'underwater-custom',
        onStart: ({ canvas }) => {
          // --- Ініціалізація Three.js ---
          scene = new THREE.Scene();
          scene.background = new THREE.Color(0x0a2a3a);
          scene.fog = new THREE.FogExp2(0x0a2a3a, 0.03);

          // Використовуємо камеру та рендерер від 8th Wall
          const xrScene = XR8.Threejs.xrScene();
          camera = xrScene.camera;
          renderer = xrScene.renderer;
          renderer.setSize(window.innerWidth, window.innerHeight);
          renderer.setPixelRatio(window.devicePixelRatio);
          document.body.appendChild(renderer.domElement);

          // Освітлення
          const ambientLight = new THREE.AmbientLight(0x88aaff, 0.9);
          scene.add(ambientLight);
          const dirLight = new THREE.DirectionalLight(0xffffff, 1.1);
          dirLight.position.set(3, 10, 4);
          scene.add(dirLight);
          const backLight = new THREE.PointLight(0x4488ff, 0.5);
          backLight.position.set(-2, 1, -3);
          scene.add(backLight);

          // Частинки (опціонально)
          const particleCount = 400;
          const particles = new THREE.BufferGeometry();
          const particlePositions = new Float32Array(particleCount * 3);
          for (let i = 0; i < particleCount; i++) {
            particlePositions[i*3] = (Math.random() - 0.5) * 40;
            particlePositions[i*3+1] = (Math.random() - 0.5) * 8;
            particlePositions[i*3+2] = (Math.random() - 0.5) * 20 - 10;
          }
          particles.setAttribute('position', new THREE.BufferAttribute(particlePositions, 3));
          const particleMat = new THREE.PointsMaterial({ color: 0x88aaff, size: 0.05, transparent: true, opacity: 0.6 });
          const particleSys = new THREE.Points(particles, particleMat);
          scene.add(particleSys);

          // Завантаження моделей рибок
          loadModels().then(group => {
            worldGroup = group;
            scene.add(worldGroup);
            worldGroup.visible = false; // спочатку невидимі
            placed = false;
          });

          sound = document.getElementById('sound');
        },
        onUpdate: () => {
          // Оновлюємо анімацію рибок, якщо вони вже розміщені
          if (placed && worldGroup) {
            animateFish(models);
          }
        },
        onCanvasClick: (event) => {
          if (!worldGroup) return;
          
          if (!placed) {
            // Розміщуємо групу в точці дотику
            const hitTest = XR8.XrController.hitTest(event.clientX, event.clientY);
            if (hitTest && hitTest.position) {
              worldGroup.position.copy(hitTest.position);
              worldGroup.quaternion.copy(hitTest.orientation);
              worldGroup.visible = true;
              placed = true;
              document.getElementById('info').innerHTML = '✅ Рибки з\'явились! Торкнись їх, щоб розігнати 🐟';
              if (sound && sound.paused) {
                sound.play().catch(e => console.log('Audio play failed:', e));
              }
            }
          } else {
            // Відштовхуємо рибок від точки дотику
            const hitTest = XR8.XrController.hitTest(event.clientX, event.clientY);
            if (hitTest && hitTest.position) {
              const touchWorldPos = hitTest.position;
              const touchLocalPos = worldGroup.worldToLocal(touchWorldPos.clone());
              models.forEach(m => {
                const dx = m.position.x - touchLocalPos.x;
                const dz = m.position.z - touchLocalPos.z;
                const dist = Math.hypot(dx, dz);
                if (dist < 1.5) {
                  const force = 0.28 / (dist + 0.1);
                  m.userData.vx += dx * force;
                  m.userData.vz += dz * force;
                  m.userData.vx += (Math.random() - 0.5) * 0.05;
                  m.userData.vz += (Math.random() - 0.5) * 0.05;
                }
              });
            }
          }
        }
      };
    }

    // --- Допоміжні функції (анімація, завантаження моделей) ---
    async function loadModel(url, scale = 0.22) {
      return new Promise((resolve, reject) => {
        const loader = new THREE.GLTFLoader();
        loader.load(url, gltf => {
          const m = gltf.scene;
          m.scale.set(scale, scale, scale);
          m.userData = {
            angle: Math.random() * Math.PI * 2,
            radius: 2.2 + Math.random() * 2.5,
            speed: 0.008 + Math.random() * 0.02,
            heightOffset: Math.random() * 1.2,
            vx: (Math.random() - 0.5) * 0.03,
            vz: (Math.random() - 0.5) * 0.03
          };
          resolve(m);
        }, undefined, reject);
      });
    }

    async function loadModels() {
      const group = new THREE.Group();
      const modelNames = ['animal1.glb', 'animal2.glb', 'animal3.glb', 'animal4.glb', 'animal5.glb', 'animal6.glb', 'animal7.glb'];
      const paths = modelNames.map(name => `assets/models/${name}`);
      const loaded = await Promise.all(paths.map(p => loadModel(p)));
      loaded.forEach(m => {
        models.push(m);
        group.add(m);
      });
      return group;
    }

    function animateFish(models) {
      const t = Date.now() * 0.001;
      models.forEach((m, idx) => {
        if (!m.userData) return;
        const data = m.userData;
        data.angle += data.speed;
        const r = data.radius;
        const dx = Math.cos(data.angle + idx);
        const dz = Math.sin(data.angle + idx);
        
        data.vx += (Math.random() - 0.5) * 0.002;
        data.vz += (Math.random() - 0.5) * 0.002;
        data.vx = Math.min(Math.max(data.vx, -0.08), 0.08);
        data.vz = Math.min(Math.max(data.vz, -0.08), 0.08);
        data.vx *= 0.98;
        data.vz *= 0.98;
        
        m.position.x += data.vx;
        m.position.z += data.vz;
        
        const targetX = Math.cos(data.angle + idx) * r;
        const targetZ = Math.sin(data.angle + idx) * r;
        m.position.x += (targetX - m.position.x) * 0.02;
        m.position.z += (targetZ - m.position.z) * 0.02;
        
        let dist = Math.hypot(m.position.x, m.position.z);
        if (dist > 4.2) {
          m.position.x *= 4.2 / dist;
          m.position.z *= 4.2 / dist;
        }
        
        m.position.y = data.heightOffset + Math.sin(t * 1.6 + idx) * 0.7;
        
        const dir = new THREE.Vector3(data.vx, 0, data.vz).normalize();
        if (dir.length() > 0.01) {
          m.lookAt(m.position.clone().add(dir));
        }
      });
    }
  </script>
</body>
</html>
